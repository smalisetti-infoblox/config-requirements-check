# Production Environment Configuration

environment: "production"

server:
  enabled: true
  port: 443
  tls:
    enabled: true
    min_version: "1.3"

database:
  enabled: true
  name: "prod_db"
  reset_on_startup: false
  replication:
    enabled: true
    replicas: 3

authentication:
  required: true
  mfa_enabled: true

load_balancer:
  enabled: true
  health_check_interval: 5

monitoring:
  enabled: true
  backend: "prometheus"
  retention_days: 365

backup:
  enabled: true
  schedule: "daily"
  retention_days: 90
