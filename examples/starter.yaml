# config-requirements.yaml
#
# Registry of cross-config requirements introduced by breaking changes to
# your project's config/values file, plus any external prerequisites you
# can't verify from here (Kafka topics, ingress rules, DNS records, etc.
# owned by other repos/teams).
#
# Check a target values file against this registry:
#   config-requirements-check -values <path> -requirements config-requirements.yaml
#   config-requirements-check -values <path> -environment prod -requirements config-requirements.yaml
# Validate this file's own structure (do this in CI):
#   config-requirements-check -lint -requirements config-requirements.yaml
# Batch check all environments:
#   config-requirements-check -values-dir envs/ -format json -requirements config-requirements.yaml

requirements:
  # Example 1: Basic equality check (original functionality)
  - id: basic-feature-toggle
    summary: >
      Feature must be explicitly enabled with new toggle.
    conditions:
      - path: some.old.flag
        equals: true
    requires:
      - path: some.new.flag
        equals: true
    remediation: >
      Set some.new.flag: true in addition to some.old.flag: true.

  # Example 2: Comparison operators (NEW - Improvement #1)
  # gte, gt, lte, lt for threshold checks
  - id: port-range-requirement
    summary: >
      Service port must be in valid unprivileged range.
    conditions:
      - path: server.enabled
        equals: true
    requires:
      - path: server.port
        gte: 1024
      - path: server.port
        lte: 65535
    remediation: >
      Configure server.port to a value between 1024 and 65535.
    remediation_hints:  # NEW - Improvement #8
      - type: set_field
        path: server.port
        value: 8080
        description: "Standard HTTP alt port"

  # Example 3: Array membership check (NEW - Improvement #2)
  # contains operator for checking array membership
  - id: cors-origin-check
    summary: >
      If CORS is enabled, must allow example.com as origin.
    conditions:
      - path: cors.enabled
        equals: true
    requires:
      - path: cors.allowed_origins
        contains: "https://example.com"
    remediation: >
      Add "https://example.com" to cors.allowed_origins array.

  # Example 4: Version/threshold check
  - id: api-version-requirement
    summary: >
      API version must be 2 or higher for new authentication.
    conditions:
      - path: api.enabled
        equals: true
    requires:
      - path: api.version
        gte: 2
    remediation: >
      Upgrade api.version to 2 or higher and update auth configuration.
    external_dependencies:
      - id: api-auth-service
        description: "Authentication service must be deployed and accessible"
        owner: "auth-platform-team"
        skip_in_environments: ["prod", "staging"]  # NEW - Improvement #6
        verify:
          type: manual
        known_implementations:
          - environment: us-dev-1
            url: https://github.com/org/auth-service/pull/123

  # Example 5: Forbidden states (NEW - Improvement #4)
  # unless blocks prevent old flags from coexisting with new ones
  - id: no-legacy-auth
    summary: >
      Legacy auth mode cannot coexist with new OAuth2 provider.
    conditions:
      - path: auth.enabled
        equals: true
    unless:  # NEW - Improvement #4
      - path: auth.legacy_only
        equals: true
    requires:
      - path: auth.provider
        equals: "oauth2"
    remediation: >
      Remove auth.legacy_only or upgrade auth.provider to oauth2.
    remediation_hints:
      - type: remove_field
        path: auth.legacy_only
        description: "This field is no longer supported"

  # Example 6: Complex multi-condition requirement
  - id: database-cluster-setup
    summary: >
      When database clustering is enabled, all cluster nodes must be configured.
    conditions:
      - path: database.clustering.enabled
        equals: true
      - path: database.engine
        equals: "postgres"
    requires:
      - path: database.cluster.primary_node
        equals: null  # Must be set (not null)
      - path: database.cluster.replica_nodes
        contains: "replica-1"
      - path: database.max_connections
        gte: 100
    remediation: >
      Configure database clustering: set primary_node, add replica nodes to array,
      and ensure max_connections is at least 100.
    remediation_hints:
      - type: set_field
        path: database.cluster.primary_node
        value: "primary-db.internal"
        description: "FQDN of primary database node"
      - type: set_field
        path: database.max_connections
        value: 200
        description: "Recommended for 3-node cluster"
    external_dependencies:
      - id: postgres-replication
        description: "PostgreSQL replication must be configured on all nodes"
        owner: "database-platform-team"
        skip_in_environments: ["local", "dev"]
        verify:
          type: manual
        known_implementations:
          - environment: us-staging
            url: https://github.com/org/deployment-config/pull/456
      - id: network-connectivity
        description: "All nodes must be able to reach each other on port 5432"
        owner: "network-team"
        verify:
          type: manual
    references:
      - label: "Database clustering RFC"
        url: https://github.com/org/architecture/blob/main/database-clustering.md
      - label: "us-staging cluster setup"
        url: https://github.com/org/deployment-config/pull/456

  # Example 7: Timeout/performance requirement
  - id: cache-timeout-threshold
    summary: >
      Cache timeout must be less than 5000ms for performance.
    conditions:
      - path: cache.enabled
        equals: true
    requires:
      - path: cache.timeout_ms
        lt: 5000
    remediation: >
      Reduce cache.timeout_ms to below 5000 (recommended: 3000-4500).
