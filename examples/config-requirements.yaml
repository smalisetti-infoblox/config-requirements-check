# Example requirements registry modeling real-world dependency chains.
# When a feature like Consolidated Health requires multiple infrastructure
# components, express all transitive dependencies explicitly.
requirements:
  - id: consolidated-health-requires-full-stack
    summary: >
      Consolidated Health checks require HMS and Redis to both be explicitly
      enabled. If consolidatedHealth.enabled=true but HMS or Redis are disabled,
      the health checks silently fail (the exact kind of gap this tool catches).

    # When consolidated health is enabled, enforce the full dependency chain
    conditions:
      - path: consolidatedHealth.enabled
        equals: true

    # All these dependencies must be satisfied for consolidated health to work
    requires:
      - path: hms.enabled
        equals: true
      - path: redis.enabled
        equals: true

    remediation: >
      Enable the full Consolidated Health stack:
      1. Set consolidatedHealth.enabled: true (already set)
      2. Set hms.enabled: true (enables the HMS service)
      3. Set redis.enabled: true (enables Redis backend required by HMS)
    external_dependencies:
      - id: kafka-topic-consolidated-health-events
        description: >
          Kafka topic `consolidated-health-events` must exist and be
          writable by the consuming service.
        owner: platform-kafka / kafka-topics repo
        verify:
          type: manual
        known_implementations:
          - environment: us-dev-2
            url: https://github.com/org/kafka-topics-repo/pull/123
      - id: ingress-consolidated-health-grpc
        description: >
          Ingress/gateway rule exposing the ConsolidatedHealthService gRPC
          endpoint must be present.
        owner: platform-ingress / ingress-config repo
        verify:
          type: manual

  - id: hms-requires-redis
    summary: >
      HMS service requires Redis to be enabled. If hms.enabled=true but
      redis.enabled=false, HMS will fail to start.

    conditions:
      - path: hms.enabled
        equals: true

    requires:
      - path: redis.enabled
        equals: true

    remediation: >
      Enable Redis: set redis.enabled: true (required for HMS to function).
