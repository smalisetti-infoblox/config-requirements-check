# Compliant example: Full dependency chain satisfied
# - consolidatedHealth.enabled: true (enables health checks)
# - hms.enabled: true (HMS service that performs health checks)
# - redis.enabled: true (backend required by HMS)
# This setup satisfies both requirements:
# 1. consolidated-health-requires-full-stack (consolidatedHealth requires hms + redis)
# 2. hms-requires-redis (hms requires redis)

consolidatedHealth:
  enabled: true

hms:
  enabled: true

redis:
  enabled: true
